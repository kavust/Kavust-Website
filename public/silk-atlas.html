<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silk · Dokunma Önizlemesi</title><style>body{margin:0;background:#080909}</style></head><body>
<div id="kavust-silk-preview">
  <header><span id="region-name">Şarabın katmanları</span></header>
  <div class="orb-stage"><canvas aria-label="Yavaşça dalgalanan, üç saydam katmandan oluşan interaktif küre"></canvas><div class="orb-error" hidden>Animasyon yüklenemedi. Lütfen önizlemeyi yeniden açın.</div></div>
  <div id="sensory-grapes"></div>
  <nav id="layers" aria-label="Katmanlar"><button data-layer="0" aria-pressed="true">Aroma</button><button data-layer="1" aria-pressed="false">Doku</button><button data-layer="2" aria-pressed="false">Bitiş</button></nav>
  <p id="layer-description" aria-live="polite"></p>
  <footer><span id="sensory-disclaimer">Temsili stil · Üretici ve rekolteye göre değişir.</span><button id="pause" type="button" aria-label="Animasyonu duraklat">Ⅱ</button></footer>
</div>
<style>
#kavust-silk-preview{background:#080909;color:#d3c299;overflow:hidden;font-family:Arial,sans-serif;position:relative}
#kavust-silk-preview header{display:flex;align-items:center;gap:18px;padding:28px 30px;letter-spacing:3px;font-size:10px}
#kavust-silk-preview .signature{font-family:Georgia,serif;font-size:34px;letter-spacing:0;color:#c5a562}
#kavust-silk-preview .orb-stage{height:240px;position:relative;max-width:760px;margin:auto}
#kavust-silk-preview canvas{width:100%;height:100%;display:block;touch-action:none;filter:brightness(2.2);cursor:grab}
#kavust-silk-preview canvas:active{cursor:grabbing}
#kavust-silk-preview footer{display:flex;justify-content:space-between;align-items:center;padding:22px 30px 30px;font-size:9px;letter-spacing:2px;color:#a99d85}
#kavust-silk-preview button{border:1px solid #4b463a;background:transparent;color:#d3c299;width:44px;height:44px;border-radius:50%;font-size:17px}
#kavust-silk-preview .orb-error{position:absolute;inset:45% 20px auto;text-align:center;color:#d3c299}
#kavust-silk-preview header{padding:16px 22px;letter-spacing:0;font-size:20px;font-family:Georgia,serif}
#sensory-grapes,#layer-description{padding:0 22px;font-size:13px;line-height:1.5;margin:12px 0}
#layers{display:flex;gap:8px;padding:0 22px}#layers button{width:auto;border-radius:4px;padding:0 12px;font-size:13px}#layers button[aria-pressed=true]{background:#3b311c;color:#f2dfb3}
#kavust-silk-preview footer{padding:12px 22px;font-size:10px;letter-spacing:0;gap:12px}#pause{flex-shrink:0}
</style>
<script type="module">
const root=document.getElementById('kavust-silk-preview');
let english=false,region='',activeLayer=0,motionFactor=1;
const descriptions={
 'Bordeaux':[['Siyah meyve ve baharat çağrışımları.','Yapılı, tanenli kırmızı stil.','Uzun ve katmanlı bitiş.'],['Dark fruit and spice notes.','Structured, tannic red style.','Long, layered finish.']],
 'Champagne':[['Narenciye ve beyaz meyve çağrışımları.','Canlı asidite ve ince kabarcıklar.','Ferah, temiz bitiş.'],['Citrus and white-fruit notes.','Lively acidity and fine bubbles.','Fresh, clean finish.']],
 'Napa Valley':[['Olgun siyah meyve çağrışımları.','Cabernet için dolgun, yapılı stil.','Yoğun meyveli bitiş.'],['Ripe dark-fruit notes.','A full, structured Cabernet style.','A concentrated fruit-led finish.']],
 'Ege':[['Bornova Misketi için çiçek ve narenciye çağrışımları.','Stile göre hafiften dolguna değişen doku.','Üzüm ve üretim stiline göre değişen bitiş.'],['Floral and citrus notes in Bornova Misketi.','Texture ranges from light to full depending on style.','Finish varies with grape and winemaking style.']]
};
function showLayer(i){activeLayer=i;root.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layer===i)));const fallback=english?['Aromas depend on grape variety and winemaking.','Body, acidity and tannin shape the texture.','The flavours and sensations that remain after a sip.']:['Aromalar üzüm çeşidi ve üretim yöntemiyle şekillenir.','Gövde, asidite ve tanen dokuyu belirler.','Bir yudumdan sonra kalan tatlar ve duyumlar.'];document.getElementById('layer-description').textContent=descriptions[region]?.[english?1:0][i]||fallback[i];}
root.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>showLayer(+b.dataset.layer));showLayer(0);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='wine-sensory')return;english=!!e.data.en;region=String(e.data.name||'');motionFactor=({'Bordeaux':.8,'Champagne':1.4,'Napa Valley':1.05,'Ege':1.2})[region]||1;document.getElementById('region-name').textContent=region+' · '+(english?'Wine layers':'Şarabın katmanları');document.getElementById('sensory-grapes').textContent=Array.isArray(e.data.grapes)?e.data.grapes.join(' · '):'';root.querySelectorAll('[data-layer]').forEach((b,i)=>b.textContent=(english?['Aroma','Texture','Finish']:['Aroma','Doku','Bitiş'])[i]);document.getElementById('sensory-disclaimer').textContent=english?'Illustrative style · Varies by producer and vintage.':'Temsili stil · Üretici ve rekolteye göre değişir.';showLayer(activeLayer);});
try {
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const canvas=root.querySelector('canvas'),stage=root.querySelector('.orb-stage');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,30);camera.position.z=7.8;
const group=new THREE.Group();scene.add(group);
const vertex=`uniform float time;uniform float layer;uniform float pixelRatio;uniform vec2 grab;uniform vec2 pull;attribute float seed;varying float brightness;
void main(){vec3 n=normalize(position);float theta=atan(n.z,n.x);float phi=acos(clamp(n.y,-1.,1.));
float speed=layer<.5?1.7:(layer<1.5?-3.35:2.45);
float verticalSpeed=layer<.5?.43:(layer<1.5?-.91:1.23);
float verticalAmplitude=layer<.5?.035:(layer<1.5?.14:.085);
float flow=time*speed;
float wave=sin(theta*3.+phi*4.+flow*.34+layer*2.1)*.035+sin(theta*5.-phi*3.-flow*.23+layer)*.022;
float fold=pow(.5+.5*sin(phi*6.+theta*2.+flow*.24+layer*1.9),5.);
// Tangential drift moves the inner fabric without shifting the sphere's centre.
float drift=sin(flow*.47+layer*2.3)*.18;
float ripple=sin(phi*2.5+time*verticalSpeed+layer*1.7)*.055;
float silkTheta=theta+(drift+ripple)*sin(phi);
float silkPhi=phi+sin(time*verticalSpeed+theta*2.+layer)*verticalAmplitude*sin(phi);
vec3 silk=vec3(sin(silkPhi)*cos(silkTheta),cos(silkPhi),sin(silkPhi)*sin(silkTheta));
vec3 p=silk*(1.+wave+fold*.075-layer*.014);p.x+=sin(phi*3.+flow*.19+layer)*.02;
vec4 mv=modelViewMatrix*vec4(p,1.);
float influence=exp(-dot(mv.xy-grab,mv.xy-grab)/.42);
mv.xy+=pull*influence;
gl_Position=projectionMatrix*mv;
gl_PointSize=(.9+fold*.35)*pixelRatio*(4.8/-mv.z);
brightness=(.1+fold*.44)*(.48+.52*abs(n.z));}`;
const fragment=`uniform vec3 tint;varying float brightness;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.12,d);gl_FragColor=vec4(tint,a*brightness);}`;
const layers=[];
for(let l=0;l<3;l++){
 const rows=140,cols=240,positions=new Float32Array(rows*cols*3),seeds=new Float32Array(rows*cols);
 let k=0;
 for(let r=0;r<rows;r++){const phi=(r+.5)/rows*Math.PI;for(let c=0;c<cols;c++){const theta=c/cols*Math.PI*2;positions[k*3]=Math.sin(phi)*Math.cos(theta);positions[k*3+1]=Math.cos(phi);positions[k*3+2]=Math.sin(phi)*Math.sin(theta);seeds[k]=k;k++;}}
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('seed',new THREE.BufferAttribute(seeds,1));
 const material=new THREE.ShaderMaterial({uniforms:{time:{value:0},layer:{value:l},grab:{value:new THREE.Vector2()},pull:{value:new THREE.Vector2()},pixelRatio:{value:renderer.getPixelRatio()},tint:{value:new THREE.Color(['#d6b978','#e4d5af','#aa8f62'][l])}},vertexShader:vertex,fragmentShader:fragment,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
 const mesh=new THREE.Points(geometry,material);mesh.rotation.set(l*.64,l*.92,l*.38);group.add(mesh);layers.push(mesh);
}
const resize=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};new ResizeObserver(resize).observe(stage);resize();
let visible=true,paused=false,last=0,time=0,x=0,y=0,tx=0,ty=0;
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;}).observe(stage);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;paused=reduced;
const drag={id:null,layer:null,start:new THREE.Vector2(),target:new THREE.Vector2(),value:new THREE.Vector2(),velocity:new THREE.Vector2()};
const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=.07;
function pointer(e){const b=canvas.getBoundingClientRect();const ndc=new THREE.Vector2((e.clientX-b.left)/b.width*2-1,1-(e.clientY-b.top)/b.height*2);return {ndc,world:new THREE.Vector2(ndc.x*camera.aspect*camera.position.z*Math.tan(Math.PI/10),ndc.y*camera.position.z*Math.tan(Math.PI/10))};}
canvas.addEventListener('pointerdown',e=>{if(drag.id!==null)return;const p=pointer(e);scene.updateMatrixWorld(true);raycaster.setFromCamera(p.ndc,camera);const hits=raycaster.intersectObjects(layers);if(!hits.length)return;drag.id=e.pointerId;if(drag.layer)drag.layer.material.uniforms.pull.value.set(0,0);drag.layer=hits[0].object;showLayer(layers.indexOf(drag.layer));drag.start.copy(p.world);drag.layer.material.uniforms.grab.value.copy(p.world);drag.target.set(0,0);drag.value.set(0,0);drag.velocity.set(0,0);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==drag.id)return;drag.target.copy(pointer(e).world).sub(drag.start);const length=drag.target.length();if(length>0)drag.target.multiplyScalar(1.35*Math.tanh(length/1.35)/length);});
function release(e){if(e.pointerId!==drag.id)return;drag.id=null;drag.target.set(0,0);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);window.addEventListener('blur',()=>{drag.id=null;drag.target.set(0,0);});
const button=root.querySelector('#pause');const updateButton=()=>{button.textContent=paused?'▷':'Ⅱ';button.setAttribute('aria-label',paused?'Animasyonu oynat':'Animasyonu duraklat');};updateButton();button.onclick=()=>{paused=!paused;updateButton();};
function frame(now){requestAnimationFrame(frame);if(now-last<33)return;const dt=Math.min((now-last)/1000,.06);last=now;if(!visible||document.hidden)return;if(!paused)time+=dt;
 // A damped spring only deforms the grabbed layer; the scene's centre stays fixed.
 if(drag.layer){const stiffness=drag.id===null?65:180;drag.velocity.x+=((drag.target.x-drag.value.x)*stiffness-drag.velocity.x*19)*dt;drag.velocity.y+=((drag.target.y-drag.value.y)*stiffness-drag.velocity.y*19)*dt;drag.value.addScaledVector(drag.velocity,dt);drag.layer.material.uniforms.pull.value.copy(drag.value);}
 layers.forEach((mesh,i)=>{mesh.material.uniforms.time.value=time*motionFactor;mesh.rotation.y=i*.92+time*(.035+i*.007);mesh.rotation.z=i*.38+Math.sin(time*.14+i)*.13;});renderer.render(scene,camera);
}requestAnimationFrame(frame);
}catch(error){
 const old=root.querySelector('canvas'),canvas=old.cloneNode();old.replaceWith(canvas);
 const ctx=canvas.getContext('2d'),stage=root.querySelector('.orb-stage');
 let w=0,h=0,t=0,last=0,visible=true,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const resize=()=>{w=stage.clientWidth;h=stage.clientHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);};new ResizeObserver(resize).observe(stage);resize();
 new IntersectionObserver(e=>{visible=e[0].isIntersecting;}).observe(stage);
 const button=root.querySelector('#pause');button.textContent=paused?'▷':'Ⅱ';button.onclick=()=>{paused=!paused;button.textContent=paused?'▷':'Ⅱ';button.setAttribute('aria-label',paused?'Animasyonu oynat':'Animasyonu duraklat');};
 const touch={id:null,layer:-1,ax:0,ay:0,tx:0,ty:0,x:0,y:0,vx:0,vy:0};
 let hitPoints=[];
 const local=e=>{const b=canvas.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
 canvas.addEventListener('pointerdown',e=>{if(touch.id!==null)return;const [x,y]=local(e);let best=400,layer=-1;for(const p of hitPoints){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<best){best=d;layer=p[2];}}if(layer<0)return;showLayer(layer);Object.assign(touch,{id:e.pointerId,layer,ax:x,ay:y,tx:0,ty:0,x:0,y:0,vx:0,vy:0});canvas.setPointerCapture(e.pointerId);});
 canvas.addEventListener('pointermove',e=>{if(e.pointerId!==touch.id)return;const [x,y]=local(e);const dx=x-touch.ax,dy=y-touch.ay,len=Math.hypot(dx,dy),limit=Math.min(w,h)*.3,f=len?limit*Math.tanh(len/limit)/len:1;touch.tx=dx*f;touch.ty=dy*f;});
 const release=e=>{if(e.pointerId!==touch.id)return;touch.id=null;touch.tx=touch.ty=0;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);};
 canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);window.addEventListener('blur',()=>{touch.id=null;touch.tx=touch.ty=0;});
 const points=[];for(let l=0;l<3;l++)for(let r=1;r<78;r++)for(let c=0;c<140;c++)points.push([r/78*Math.PI,c/140*Math.PI*2,l]);
 function frame(now){requestAnimationFrame(frame);if(now-last<33)return;const dt=Math.min((now-last)/1000,.04);last=now;if(!visible||document.hidden)return;if(!paused)t+=dt;ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';const size=Math.min(w*.22,h*.23);
 const stiffness=touch.id===null?65:180;touch.vx+=((touch.tx-touch.x)*stiffness-touch.vx*19)*dt;touch.vy+=((touch.ty-touch.y)*stiffness-touch.vy*19)*dt;touch.x+=touch.vx*dt;touch.y+=touch.vy*dt;hitPoints=[];
 for(const [baseP,q,l] of points){const flow=t*motionFactor*[1.7,-3.35,2.45][l],verticalSpeed=[.43,-.91,1.23][l];const p=baseP+Math.sin(t*verticalSpeed+q*2+l)*[.035,.14,.085][l]*Math.sin(baseP);const drift=(Math.sin(flow*.47+l*2.3)*.18+Math.sin(baseP*2.5+t*verticalSpeed+l*1.7)*.055)*Math.sin(baseP);const a=q+t*(.045+l*.01)+drift,fold=Math.pow(.5+.5*Math.sin(baseP*6+q*2+flow*.24+l*1.9),5),rad=1+Math.sin(q*3+baseP*4+flow*.34+l*2.1)*.035+Math.sin(q*5-baseP*3-flow*.23+l)*.022+fold*.075-l*.014;
 let x=Math.sin(p)*Math.cos(a)*rad,y=Math.cos(p)*rad,z=Math.sin(p)*Math.sin(a)*rad;const tilt=l*.65+.3;const yy=y*Math.cos(tilt)-z*Math.sin(tilt);z=y*Math.sin(tilt)+z*Math.cos(tilt);y=yy;const angle=l*.65+Math.sin(t*.14+l)*.13;const xx=x*Math.cos(angle)-y*Math.sin(angle);y=x*Math.sin(angle)+y*Math.cos(angle);x=xx;const perspective=3.8/(3.8-z);let sx=w/2+x*size*perspective,sy=h/2+y*size*perspective;
 if(l===touch.layer){const weight=Math.exp(-((sx-touch.ax)**2+(sy-touch.ay)**2)/(size*size*.42));sx+=touch.x*weight;sy+=touch.y*weight;}hitPoints.push([sx,sy,l]);ctx.fillStyle='rgba(218,194,147,'+((.035+fold*.29)*(.6+.4*(z+1)/2))+')';ctx.fillRect(sx,sy,.7*perspective,.7*perspective);}}
 requestAnimationFrame(frame);
}
</script>
</body></html>
