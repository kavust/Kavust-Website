<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silk · Dokunma Önizlemesi</title><style>body{margin:0;background:#080909}</style></head><body>
<div id="kavust-silk-preview">
  <header><span id="region-name">Şarabın katmanları</span><button id="pause" type="button" aria-label="Animasyonu duraklat">Ⅱ</button></header>
  <div class="orb-stage"><canvas aria-label="Yavaşça dalgalanan, üç saydam katmandan oluşan interaktif küre"></canvas><div class="orb-error" hidden>Animasyon yüklenemedi. Lütfen önizlemeyi yeniden açın.</div></div>
  <div id="sensory-grapes"></div>
  <nav id="layers" aria-label="Katmanlar"><button data-layer="0" aria-pressed="true">Aroma</button><button data-layer="1" aria-pressed="false">Doku</button><button data-layer="2" aria-pressed="false">Bitiş</button></nav>
  <p id="layer-description" aria-live="polite"></p>
  <footer><span id="sensory-disclaimer">Temsili stil · Üretici ve rekolteye göre değişir.</span></footer>
</div>
<style>
#kavust-silk-preview{background:#080909;color:#d3c299;overflow:hidden;font-family:Arial,sans-serif;position:relative}
#kavust-silk-preview header{display:flex;align-items:center;gap:18px;padding:28px 30px;letter-spacing:3px;font-size:10px}
#kavust-silk-preview .signature{font-family:Georgia,serif;font-size:34px;letter-spacing:0;color:#c5a562}
#kavust-silk-preview .orb-stage{height:270px;position:relative;width:min(100%,460px);margin:0 auto;isolation:isolate;overflow:hidden}
#kavust-silk-preview .orb-stage::before,#kavust-silk-preview .orb-stage::after{content:"";position:absolute;pointer-events:none;border-radius:50%;z-index:-1}
#kavust-silk-preview .orb-stage::before{width:108%;height:145%;left:-4%;top:-22%;background:radial-gradient(ellipse at 46% 44%,rgba(38,112,202,.38),transparent 48%),radial-gradient(ellipse at 68% 40%,rgba(118,94,221,.27),transparent 43%),radial-gradient(ellipse at 35% 65%,rgba(48,188,210,.17),transparent 48%),radial-gradient(ellipse at 50% 50%,#0d1c30 0%,#09111d 63%,transparent 100%);filter:blur(18px);animation:silk-aura-drift 17s ease-in-out infinite alternate}
#kavust-silk-preview .orb-stage::after{width:58%;aspect-ratio:1;left:21%;top:2%;background:radial-gradient(circle,rgba(79,139,236,.21),rgba(76,115,205,.1) 45%,transparent 72%);filter:blur(12px);animation:silk-aura-breathe 8s ease-in-out infinite alternate}
@keyframes silk-aura-drift{0%{transform:translate3d(-3%,1%,0) rotate(-7deg) scale(.94);filter:blur(20px) hue-rotate(-12deg)}50%{transform:translate3d(2%,-2%,0) rotate(4deg) scale(1.04)}100%{transform:translate3d(4%,2%,0) rotate(10deg) scale(.98);filter:blur(16px) hue-rotate(22deg)}}
@keyframes silk-aura-breathe{from{transform:scale(.84);opacity:.52}to{transform:scale(1.18);opacity:.92}}
#kavust-silk-preview canvas{width:100%;height:100%;display:block;position:relative;z-index:1;touch-action:pan-y pinch-zoom;filter:brightness(1.35);cursor:grab}
#kavust-silk-preview canvas:active{cursor:grabbing}
#kavust-silk-preview footer{display:flex;justify-content:space-between;align-items:center;padding:22px 30px 30px;font-size:9px;letter-spacing:2px;color:#a99d85}
#kavust-silk-preview button{border:1px solid #4b463a;background:transparent;color:#d3c299;width:44px;height:44px;border-radius:50%;font-size:17px}
#kavust-silk-preview .orb-error{position:absolute;inset:45% 20px auto;text-align:center;color:#d3c299}
#kavust-silk-preview header{justify-content:space-between;padding:12px 20px 4px;letter-spacing:1px;font-size:13px;font-family:Arial,sans-serif;color:#c9b77f;text-transform:uppercase}
#sensory-grapes,#layer-description{padding:0 22px;font-size:13px;line-height:1.5;margin:12px 0}
#layers{display:flex;gap:8px;padding:0 22px}#layers button{width:auto;border-radius:4px;padding:0 12px;font-size:13px}#layers button[aria-pressed=true]{background:#3b311c;color:#f2dfb3}
#kavust-silk-preview footer{padding:10px 20px 14px;font-size:10px;letter-spacing:0;gap:12px;color:#8e8b80}
#kavust-silk-preview #pause{width:32px;height:32px;border-radius:50%;font-size:13px;flex-shrink:0}
#kavust-silk-preview canvas{filter:brightness(1.42)}
#kavust-silk-preview[data-layer="2"] .orb-stage{background:#0c1927}
#kavust-silk-preview[data-layer="2"] .orb-stage::before,#kavust-silk-preview[data-layer="2"] .orb-stage::after{display:none;animation:none}
@media(prefers-reduced-motion:reduce){#kavust-silk-preview .orb-stage::before,#kavust-silk-preview .orb-stage::after{animation:none}}
</style>
<script type="module">
import { initSilk } from './silk-runtime.js';
initSilk(document.getElementById('kavust-silk-preview'));
</script>
</body></html>
